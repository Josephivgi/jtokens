[package]
name = "jtokens"
version = "1.3.0"
edition = "2021"
description = "Fast token and API cost viewer for Claude Code, Codex, OpenCode, Pi and Droid"
license = "MIT"
repository = "https://github.com/Josephivgi/jtokens"

[dependencies]
wry = "0.57"
tao = "0.37"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-winrt-notification = "0.8"

[build-dependencies]
cc = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
